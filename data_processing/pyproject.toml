[project]
name = "ego-multisensor-data-processing"
version = "0.1.0"
description = "Alignment, projection, triangulation, and 2D pose post-processing for ego-camera datasets."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0",
  "scipy>=1.11",
  "opencv-python>=4.8,<5",
  "matplotlib>=3.8",
  "Pillow>=10",
  "PyYAML>=6",
  "pupil-apriltags>=1.0.4",
]

[project.optional-dependencies]
pose = [
  "torch>=2.5",
  "rtmlib>=0.0.15",
  "ultralytics>=8",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
