<div id="hybrid3d-root">
  <style>
    #hybrid3d-root {
      width: 100%;
      color: var(--foreground);
      font: 13px/1.4 var(--font-sans);
    }
    #hybrid3d-root .hybrid3d-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    #hybrid3d-root .hybrid3d-controls .form-range {
      flex: 1 1 280px;
      min-width: 180px;
    }
    #hybrid3d-root .hybrid3d-frame {
      min-width: 150px;
      font-variant-numeric: tabular-nums;
    }
    #hybrid3d-root .hybrid3d-panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    #hybrid3d-root .hybrid3d-panel {
      min-width: 0;
    }
    #hybrid3d-root .hybrid3d-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 30px;
      margin-bottom: 4px;
    }
    #hybrid3d-root .hybrid3d-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
    }
    #hybrid3d-root .hybrid3d-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--dot-color);
    }
    #hybrid3d-root .hybrid3d-stage {
      position: relative;
      height: 420px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
    }
    #hybrid3d-root canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #hybrid3d-root canvas:active {
      cursor: grabbing;
    }
    #hybrid3d-root .hybrid3d-tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 2;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--popover);
      color: var(--popover-foreground);
      box-shadow: var(--shadow-sm);
      font-size: 12px;
      white-space: nowrap;
    }
    #hybrid3d-root .hybrid3d-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }
    #hybrid3d-root .hybrid3d-metric {
      padding: 7px 9px;
      border-left: 3px solid var(--viz-series-3);
      background: var(--muted);
    }
    #hybrid3d-root .hybrid3d-metric b {
      display: block;
      font-size: 12px;
      color: var(--muted-foreground);
      font-weight: 500;
    }
    #hybrid3d-root .hybrid3d-help {
      margin-top: 8px;
      color: var(--muted-foreground);
      font-size: 12px;
    }
    @media (max-width: 620px) {
      #hybrid3d-root .hybrid3d-panels {
        grid-template-columns: 1fr;
      }
      #hybrid3d-root .hybrid3d-stage {
        height: 390px;
      }
      #hybrid3d-root .hybrid3d-metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="hybrid3d-controls">
    <button class="btn btn-primary btn-sm" id="hybrid3d-play" type="button" aria-label="播放骨架序列">▶ 播放</button>
    <input class="form-range" id="hybrid3d-range" type="range" min="0" max="19" value="0" step="1" aria-label="骨架帧">
    <span class="hybrid3d-frame" id="hybrid3d-frame"></span>
    <button class="btn btn-secondary btn-sm" id="hybrid3d-reset" type="button">重置视角</button>
    <span class="viz-badge">深度约束：原始 BVH 径向距离</span>
  </div>

  <div class="hybrid3d-panels">
    <section class="hybrid3d-panel" aria-label="原始 BVH 三维骨架">
      <div class="hybrid3d-panel-head">
        <span class="hybrid3d-title"><span class="hybrid3d-dot" style="--dot-color:var(--viz-series-1)"></span>原始 BVH 3D</span>
      </div>
      <div class="hybrid3d-stage" id="hybrid3d-stage-raw">
        <div class="hybrid3d-tooltip"></div>
      </div>
    </section>
    <section class="hybrid3d-panel" aria-label="新融合三维骨架">
      <div class="hybrid3d-panel-head">
        <span class="hybrid3d-title"><span class="hybrid3d-dot" style="--dot-color:var(--viz-series-2)"></span>融合 3D：2D 肩肘 + 刚体腕</span>
      </div>
      <div class="hybrid3d-stage" id="hybrid3d-stage-fused">
        <div class="hybrid3d-tooltip"></div>
      </div>
    </section>
  </div>

  <div class="hybrid3d-metrics">
    <div class="hybrid3d-metric"><b>肩部 3D 位移</b><span id="hybrid3d-shoulder"></span></div>
    <div class="hybrid3d-metric"><b>肘部 3D 位移</b><span id="hybrid3d-elbow"></span></div>
    <div class="hybrid3d-metric"><b>腕部 3D 位移</b><span id="hybrid3d-wrist"></span></div>
  </div>
  <div class="hybrid3d-help">拖动旋转，滚轮缩放；两个窗口视角同步。融合侧的大节点为被替换的肩、肘和腕。</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    (() => {
      const DATA = __DATA__;
      const root = document.getElementById("hybrid3d-root");
      const frameRange = root.querySelector("#hybrid3d-range");
      const frameLabel = root.querySelector("#hybrid3d-frame");
      const playButton = root.querySelector("#hybrid3d-play");
      const modified = new Set(DATA.modified_indices);
      const viewers = [];
      let frameIndex = 0;
      let playing = false;
      let lastStep = 0;
      let syncLock = false;
      const colorCanvas = document.createElement("canvas");
      colorCanvas.width = colorCanvas.height = 1;
      const colorContext = colorCanvas.getContext("2d");
      const colorProbe = document.createElement("span");
      colorProbe.style.display = "none";
      root.appendChild(colorProbe);

      function themeColor(name) {
        colorProbe.style.color = `var(${name})`;
        const source = getComputedStyle(colorProbe).color;
        colorContext.clearRect(0, 0, 1, 1);
        colorContext.fillStyle = source;
        colorContext.fillRect(0, 0, 1, 1);
        const [r, g, b] = colorContext.getImageData(0, 0, 1, 1).data;
        return `rgb(${r},${g},${b})`;
      }

      function makeViewer(stageId, key, colorVar) {
        const stage = root.querySelector(`#${stageId}`);
        const tooltip = stage.querySelector(".hybrid3d-tooltip");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.domElement.setAttribute("role", "img");
        renderer.domElement.setAttribute("aria-label", key === "raw" ? "可旋转的原始BVH三维骨架" : "可旋转的新融合三维骨架");
        stage.insertBefore(renderer.domElement, tooltip);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, -410, 0);
        camera.position.set(1450, 260, 1750);

        const ambient = new THREE.AmbientLight(0xffffff, 0.82);
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.55);
        keyLight.position.set(600, 900, 700);
        scene.add(ambient, keyLight);

        const grid = new THREE.GridHelper(2400, 12);
        grid.position.y = -1160;
        grid.material.transparent = true;
        grid.material.opacity = 0.26;
        scene.add(grid);

        const boneGeometry = new THREE.BufferGeometry();
        const boneMaterial = new THREE.LineBasicMaterial({ linewidth: 2 });
        const bones = new THREE.LineSegments(boneGeometry, boneMaterial);
        scene.add(bones);

        const jointMeshes = DATA.joints.map((joint, index) => {
          const radius = key === "fused" && modified.has(index) ? 25 : 17;
          const geometry = new THREE.SphereGeometry(radius, 14, 10);
          const material = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.05 });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.userData = { joint, index };
          scene.add(mesh);
          return mesh;
        });

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        renderer.domElement.addEventListener("pointermove", event => {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hit = raycaster.intersectObjects(jointMeshes, false)[0];
          if (!hit) {
            tooltip.style.display = "none";
            return;
          }
          const p = hit.object.position;
          tooltip.textContent = `${hit.object.userData.joint}  (${p.x.toFixed(0)}, ${p.y.toFixed(0)}, ${p.z.toFixed(0)}) mm`;
          tooltip.style.left = `${event.clientX - rect.left + 12}px`;
          tooltip.style.top = `${event.clientY - rect.top + 12}px`;
          tooltip.style.display = "block";
        });
        renderer.domElement.addEventListener("pointerleave", () => tooltip.style.display = "none");

        function applyTheme() {
          const skeletonColor = themeColor(colorVar);
          const highlightColor = themeColor("--viz-series-3");
          const gridColor = themeColor("--border");
          boneMaterial.color.setStyle(skeletonColor);
          grid.material.color.setStyle(gridColor);
          jointMeshes.forEach((mesh, index) => {
            mesh.material.color.setStyle(key === "fused" && modified.has(index) ? highlightColor : skeletonColor);
          });
        }

        function update(points) {
          const linePositions = [];
          DATA.edges.forEach(([a, b]) => {
            linePositions.push(...points[a], ...points[b]);
          });
          boneGeometry.setAttribute("position", new THREE.Float32BufferAttribute(linePositions, 3));
          boneGeometry.computeBoundingSphere();
          jointMeshes.forEach((mesh, index) => mesh.position.fromArray(points[index]));
        }

        function resize() {
          const width = Math.max(stage.clientWidth, 1);
          const height = Math.max(stage.clientHeight, 1);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        }

        new ResizeObserver(resize).observe(stage);
        controls.addEventListener("change", () => {
          if (syncLock || viewers.length < 2) return;
          syncLock = true;
          const other = viewers.find(viewer => viewer.controls !== controls);
          if (other) {
            other.camera.position.copy(camera.position);
            other.camera.quaternion.copy(camera.quaternion);
            other.controls.target.copy(controls.target);
            other.controls.update();
          }
          syncLock = false;
        });
        applyTheme();
        resize();
        return { scene, camera, renderer, controls, update, applyTheme };
      }

      viewers.push(makeViewer("hybrid3d-stage-raw", "raw", "--viz-series-1"));
      viewers.push(makeViewer("hybrid3d-stage-fused", "fused", "--viz-series-2"));

      function pairText(delta, leftKey, rightKey) {
        return `左 ${delta[leftKey].toFixed(1)} / 右 ${delta[rightKey].toFixed(1)} mm`;
      }

      function setFrame(index) {
        frameIndex = (index + DATA.frames.length) % DATA.frames.length;
        const frame = DATA.frames[frameIndex];
        viewers[0].update(frame.raw);
        viewers[1].update(frame.fused);
        frameRange.value = String(frameIndex);
        frameLabel.textContent = `seq ${frame.seq} · ${frameIndex + 1}/${DATA.frames.length}`;
        root.querySelector("#hybrid3d-shoulder").textContent = pairText(frame.delta_mm, "LeftArm", "RightArm");
        root.querySelector("#hybrid3d-elbow").textContent = pairText(frame.delta_mm, "LeftForeArm", "RightForeArm");
        root.querySelector("#hybrid3d-wrist").textContent = pairText(frame.delta_mm, "LeftHand", "RightHand");
      }

      function resetView() {
        viewers.forEach(viewer => {
          viewer.camera.position.set(1450, 260, 1750);
          viewer.controls.target.set(0, -410, 0);
          viewer.controls.update();
        });
      }

      function animate(time) {
        requestAnimationFrame(animate);
        if (playing && time - lastStep > 240) {
          setFrame(frameIndex + 1);
          lastStep = time;
        }
        viewers.forEach(viewer => {
          viewer.controls.update();
          viewer.renderer.render(viewer.scene, viewer.camera);
        });
      }

      frameRange.addEventListener("input", () => setFrame(Number(frameRange.value)));
      playButton.addEventListener("click", () => {
        playing = !playing;
        playButton.textContent = playing ? "❚❚ 暂停" : "▶ 播放";
        playButton.setAttribute("aria-label", playing ? "暂停骨架序列" : "播放骨架序列");
      });
      root.querySelector("#hybrid3d-reset").addEventListener("click", resetView);
      new MutationObserver(() => viewers.forEach(viewer => viewer.applyTheme()))
        .observe(document.documentElement, { attributes: true, attributeFilter: ["class", "style", "data-theme"] });

      setFrame(0);
      resetView();
      requestAnimationFrame(animate);
    })();
  </script>
</div>
