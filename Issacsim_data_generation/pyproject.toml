[project]
name = "head-fisheye-wrist-tag-sim"
version = "0.1.0"
description = "Geometry-first simulation for head-mounted fisheye cameras observing wrist tags."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
vision = [
  "opencv-python>=4.8",
]
viewer = []
realistic = [
  "opencv-python>=4.8",
]
assets = [
  "py7zr>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
